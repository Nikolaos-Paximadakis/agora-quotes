[project]
name = "agora-quotes"
version = "0.1.0"
description = "One consistent interface for stock market quotes (ATHEX first, plus US and other markets), wrapping existing data sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "yfinance>=0.2.60",
]

[project.optional-dependencies]
twelvedata = [
    "twelvedata>=1.4.0",
    "websocket-client>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agora_quotes"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "twelvedata>=1.4.0",
    "websocket-client>=1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real network; runs only with AGORA_QUOTES_LIVE_TESTS=1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "twelvedata", "twelvedata.*"]
ignore_missing_imports = true
